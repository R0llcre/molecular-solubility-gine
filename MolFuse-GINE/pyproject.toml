[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molfuse-gine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "scipy>=1.10",
  "PyYAML>=6.0",
  "tqdm>=4.65",
]

[project.optional-dependencies]
graph = ["torch>=2.0", "torch-geometric>=2.3"]
chem = ["rdkit>=2023.9"]
tabular = ["xgboost>=2.0", "lightgbm>=4.0", "catboost>=1.2"]
pretrained = ["transformers>=4.40", "torch>=2.0"]
dev = ["pytest>=8.0"]
full = [
  "torch>=2.0",
  "torch-geometric>=2.3",
  "rdkit>=2023.9",
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "catboost>=1.2",
  "transformers>=4.40",
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["molfuse_gine*"]
exclude = ["data*", "configs*", "tests*", "scripts*", "runs*", "ablation_runs*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
