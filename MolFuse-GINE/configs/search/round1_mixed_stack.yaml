name: round1_mixed_stack
output_root: sota_runs_v2
seeds: [1, 2, 3, 4, 5]

configs:
  - configs/esol_gine_desc16.yaml
  - configs/esol_gine_desc16_scaffold.yaml
  - configs/lipo_gine_desc16.yaml
  - configs/lipo_gine_desc16_scaffold.yaml
  - configs/freesolv_gine_desc16.yaml
  - configs/freesolv_gine_desc16_scaffold.yaml

graph_variants:
  - gine
  - gine_desc
  - gine_desc_concat
  - gine_desc_residual_add
  - gine_desc_film_graph
  - pna_desc
  - dmpnn_desc
  - attentivefp_desc

graph_oof_variants:
  - gine_desc_concat
  - pna_desc
  - dmpnn_desc
  - attentivefp_desc

tabular:
  feature_sets:
    - desc16
    - desc16_morgan2
    - desc16_morgan2_maccs
    - rdkit2d_selected64_morgan2_maccs
    - rdkit2d_selected128_morgan2_maccs
    - rdkit2d_selected64_morgan2_maccs_fg
  models:
    - ridge
    - elasticnet
    - svr
    - rf
    - extratrees
    - xgb
    - lightgbm
    - catboost

tabular_stack:
  folds: 5
  meta_model: ridge
  experts:
    - desc16_morgan2_maccs:ridge
    - desc16_morgan2_maccs:xgb
    - desc16_morgan2_maccs:lightgbm
    - rdkit2d_selected64_morgan2_maccs:ridge
    - rdkit2d_selected64_morgan2_maccs:xgb

mixed_stack:
  meta_models:
    - average
    - ridge
    - elasticnet
    - bayesian_ridge
    - nonnegative
  expert_dir_templates:
    - "{cfg_out}/tabular_stack/runs/seed{seed}_ridge"
    - "{cfg_out}/graph_oof/runs/seed{seed}_gine_desc_concat"
    - "{cfg_out}/graph_oof/runs/seed{seed}_pna_desc"
    - "{cfg_out}/graph_oof/runs/seed{seed}_dmpnn_desc"

distill:
  teacher_template: "{cfg_out}/mixed_stack/runs/seed{seed}_ridge"
  split_template: "{cfg_out}/tabular_stack/splits/seed{seed}"
  variants:
    - gine_desc_concat
  weights: [0.3, 0.5, 1.0]
