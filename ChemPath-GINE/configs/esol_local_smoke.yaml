run:
  name: "esol_local_smoke"
  output_dir: "runs"
  seed: 42
  device: "auto"

data:
  csv: "data/processed/esol.csv"
  smiles_col: "SMILES"
  target_col: "Solubility"
  descriptor_cols: []
  split: "random"
  train_ratio: 0.7
  val_ratio: 0.15
  cache_dir: "cache"

model:
  variant: "chempath_gine"
  hidden_dim: 64
  num_gnn_layers: 2
  num_attention_layers: 1
  heads: 4
  dropout: 0.15
  use_descriptor_fusion: false
  use_descriptor_path_gate: false
  max_path_distance: 12

train:
  epochs: 2
  batch_size: 64
  lr: 0.0005
  weight_decay: 0.00001
  accum_steps: 1
  max_grad_norm: 5.0
  patience: 2
  num_workers: 0
