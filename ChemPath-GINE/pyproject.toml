[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chempath-gine"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["chempath_gine*"]
exclude = ["data*", "configs*", "tests*", "scripts*", "runs*", "ablation_runs*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
